<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
<title>BOOTH STUDIO</title>
<meta name="application-name" content="BOOTH STUDIO">
<meta name="apple-mobile-web-app-title" content="BOOTH STUDIO">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C0C0A">
<meta name="format-detection" content="telephone=no">
<style>
  :root{
    --primary:#6CBE45; --primary-dark:#4E9A2E; --primary-light:#9BD877;
    --accent:#E89C3C; --accent-dark:#C77F22;
    --bg:#0C0C0A; --surface:#161612; --surface-light:#1F1F18;
    --text:#F2F2EA; --muted:#9BA08E; --on-primary:#0C0C0A;
    --border:#2A2C22; --danger:#E05B4C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,Arial,sans-serif;min-height:100vh}
  #app{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  .logo{ text-align:center;margin:26px 0 6px}
  .logo .mark{color:var(--primary);font-size:46px;font-weight:900;letter-spacing:4px;line-height:1}
  .logo .sub{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:4px;margin-top:4px}
  .tagline{text-align:center;color:var(--muted);font-size:14px;margin-bottom:30px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
  .card.hl{border-color:var(--primary);border-width:1.5px}
  .menu-item{display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .12s}
  .menu-item:hover{transform:translateY(-1px)}
  .icon-box{width:48px;height:48px;border-radius:12px;background:var(--surface-light);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--primary);flex-shrink:0}
  .icon-box.hl{background:var(--primary);color:var(--on-primary)}
  .mi-title{font-size:17px;font-weight:800}
  .mi-sub{color:var(--muted);font-size:13px;margin-top:3px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;width:100%;font-family:inherit}
  .btn-primary{background:var(--primary);color:var(--on-primary)}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
  .btn-ghost{background:transparent;color:var(--muted)}
  .btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px}
  .row .btn{flex:1}
  h2.section{font-size:20px;font-weight:800;margin-bottom:4px}
  .section-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  label{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:6px}
  input[type=text],input[type=number],input[type=password],textarea{
    width:100%;background:var(--surface-light);border:1px solid var(--border);border-radius:10px;
    padding:11px 12px;color:var(--text);font-size:16px;font-family:inherit;margin-bottom:14px}
  textarea{min-height:80px;resize:vertical}
  input:focus,textarea:focus{outline:1.5px solid var(--primary)}
  .steps{display:flex;gap:6px;margin:8px 0 20px}
  .steps div{flex:1;height:4px;border-radius:2px;background:var(--border)}
  .steps div.on{background:var(--primary)}
  .step-label{color:var(--muted);font-size:13px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .chip{border:1px solid var(--border);background:var(--surface-light);border-radius:20px;
    padding:8px 14px;font-size:14px;cursor:pointer;user-select:none}
  .chip.on{background:var(--primary);color:var(--on-primary);font-weight:700;border-color:var(--primary)}
  .shape{display:flex;align-items:center;gap:12px;cursor:pointer}
  .shape .s-icon{font-size:24px;width:34px;text-align:center;color:var(--muted)}
  .shape .s-title{font-weight:700;font-size:16px}
  .shape .s-desc{color:var(--muted);font-size:12.5px;margin-top:2px}
  .shape .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-inline-start:auto}
  .card.sel{border-color:var(--primary);border-width:1.5px}
  .card.sel .radio{border-color:var(--primary);background:var(--primary)}
  .card.sel .s-title,.card.sel .s-icon{color:var(--primary)}
  .area-note{color:var(--primary);font-weight:700;font-size:15px}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;text-align:center;gap:18px}
  .spinner{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .gen-status{font-size:16px;font-weight:600}
  .gen-hint{color:var(--muted);font-size:12px}
  .err{color:var(--danger);font-weight:700}
  .err-msg{color:var(--muted);font-size:14px;line-height:1.6;max-width:420px}
  .design-card{padding:0;overflow:hidden}
  .design-card img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--surface-light)}
  .design-body{padding:16px}
  .badge{display:inline-block;background:var(--surface-light);border:1px solid var(--border);
    color:var(--accent);font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px}
  .style-name{font-size:17px;font-weight:800;margin:8px 0 6px}
  .style-desc{color:var(--muted);font-size:13.5px;line-height:1.6;margin-bottom:12px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .back-link{color:var(--muted);cursor:pointer;font-size:14px;background:none;border:none;font-family:inherit}
  .back-link:hover{color:var(--primary)}
  .lang-toggle{background:var(--surface-light);border:1px solid var(--border);color:var(--primary);
    font-weight:700;font-size:13px;border-radius:18px;padding:6px 14px;cursor:pointer}
  .plan-svg-card{background:#fff;border-radius:14px;padding:8px;margin-bottom:18px;border:1px solid var(--border)}
  .plan-svg-card svg{width:100%;height:auto;display:block}
  .drawing-h{font-size:16px;font-weight:800;margin:16px 0 8px}
  .sched-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
  .sched-row:last-child{border-bottom:none}
  .num-badge{width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--on-primary);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
  .sched-label{flex:1;font-size:14px}
  .sched-cat{color:var(--accent);font-size:11.5px;font-weight:700}
  .proj-cover{width:100%;height:150px;object-fit:cover;display:block;background:var(--surface-light)}
  .empty{color:var(--muted);text-align:center;padding:60px 20px}
  .empty .e-icon{font-size:44px;color:var(--border)}
  .hint{color:var(--muted);font-size:12px;line-height:1.6}
  .saved-msg{color:var(--primary);text-align:center;font-weight:700;margin-top:10px}
  .footer-note{text-align:center;color:var(--muted);opacity:.65;font-size:12px;margin-top:40px}
  .logo-box{border:2px dashed var(--border);border-radius:14px;padding:20px;text-align:center;cursor:pointer;
    background:var(--surface-light);margin-bottom:14px;transition:border-color .15s}
  .logo-box:hover{border-color:var(--primary)}
  .logo-box img{max-height:90px;max-width:80%;object-fit:contain;display:block;margin:0 auto 8px}
  .logo-box .lb-hint{color:var(--muted);font-size:13px}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .swatch{width:46px;height:46px;border-radius:10px;border:2px solid var(--border);padding:0;background:none;cursor:pointer}
  input[type=color]{-webkit-appearance:none;appearance:none}
  input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:6px}
  .opt-label{color:var(--muted);font-size:13px;font-weight:600;margin:10px 0 6px}
  .tips-card{border-color:var(--accent)}
  .tip-row{display:flex;gap:10px;padding:7px 0;color:var(--text);font-size:13.5px;line-height:1.6}
  .tip-row .ti{color:var(--accent)}
  .fab-sum{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .fab-pill{background:var(--surface-light);border:1px solid var(--border);border-radius:10px;
    padding:7px 12px;font-size:12.5px;color:var(--text)}
  .fab-pill b{color:var(--primary)}
  .thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .thumb{width:76px;height:50px;object-fit:cover;border-radius:8px;border:2px solid var(--border);cursor:pointer;background:var(--surface-light)}
  .thumb.on{border-color:var(--primary)}
  #printArea{display:none}
  @media print{
    body>#app{display:none}
    #printArea{display:block;background:#fff;color:#141414;font-family:Arial,Tahoma,sans-serif}
    #printArea .tb{display:flex;justify-content:space-between;align-items:center;border:2px solid #141414;padding:12px 16px;margin-bottom:16px}
    #printArea .tb .pm{color:#5A9E2F;font-size:34px;font-weight:900;letter-spacing:3px}
    #printArea .tb .ps{color:#C77F22;font-size:10px;font-weight:700;letter-spacing:3px}
    #printArea .tb .meta{font-size:11px;line-height:1.8}
    #printArea .tb .meta b{color:#5A9E2F}
    #printArea h2{font-size:14px;border-inline-start:4px solid #5A9E2F;padding-inline-start:8px;margin:18px 0 8px}
    #printArea img.render{width:100%;border:1px solid #ccc}
    #printArea .dw{border:1px solid #ddd;margin-bottom:4px}
    #printArea .dw svg{width:100%;height:auto}
    #printArea table{width:100%;border-collapse:collapse;font-size:11.5px}
    #printArea th,#printArea td{border:1px solid #bbb;padding:6px 9px}
    #printArea th{background:#5A9E2F;color:#fff}
    #printArea td.n{text-align:center;font-weight:bold;color:#5A9E2F;width:40px}
    #printArea .pb{page-break-before:always}
    #printArea .pfoot{margin-top:20px;font-size:9px;color:#888;text-align:center;border-top:1px solid #ddd;padding-top:6px}
    #printArea .sheet{border:1px solid #999;margin-bottom:10px;page-break-inside:avoid}
    #printArea .sheet svg{width:100%;height:auto;display:block}
    #printArea .palette{display:flex;gap:6px;margin:6px 0}
    #printArea .palette div{width:26px;height:26px;border:1px solid #999;border-radius:4px}
    #printArea .note{font-size:11px;color:#444;background:#F2F7EC;border:1px solid #cde0b8;padding:8px 10px;border-radius:6px;margin:8px 0}
  }
  @media(max-width:520px){ .logo .mark{font-size:38px} #app{padding:14px 12px 50px} }

  /* ============ MOBILE-FIRST / PWA LAYER ============ */
  html{-webkit-text-size-adjust:100%}
  body{-webkit-tap-highlight-color:transparent;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none}
  #app{max-width:760px;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .topbar{position:sticky;top:0;z-index:30;background:var(--bg);
    padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;margin-bottom:8px}
  .lang-toggle{min-height:40px}
  #bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
    background:rgba(22,22,18,.97);border-top:1px solid var(--border);backdrop-filter:blur(10px);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .bn-item{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 7px;font-size:11px;font-weight:700}
  .bn-item .bn-ic{font-size:21px;line-height:1}
  .bn-item.on{color:var(--primary)}
  .bn-item:active{transform:scale(.95)}
  #pwaInstall{position:fixed;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:50;
    display:flex;align-items:center;gap:10px;background:var(--surface-light);border:1px solid var(--primary);
    border-radius:14px;padding:10px 12px;box-shadow:0 8px 26px rgba(0,0,0,.5)}
  #pwaInstall[hidden]{display:none}
  .pwa-cta{flex:1;background:var(--primary);color:var(--on-primary);border:none;border-radius:10px;
    padding:12px;font-size:14.5px;font-weight:800;font-family:inherit;cursor:pointer}
  .pwa-msg{flex:1;color:var(--text);font-size:13px;line-height:1.5}
  .pwa-x{background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:6px;flex-shrink:0}
  @media(max-width:680px){
    #app{padding-left:14px;padding-right:14px}
    .btn{padding:15px 22px;font-size:16.5px}
    .chip{padding:11px 16px;font-size:15px}
    .icon-box{width:52px;height:52px;font-size:24px}
    .mi-title{font-size:18px}
    .shape .s-icon{font-size:26px}
    .card{padding:16px;border-radius:18px}
    .thumb{width:84px;height:56px}
    .swatch{width:52px;height:52px}
    input[type=text],input[type=number],input[type=password],textarea{padding:13px 13px}
    .design-card img{aspect-ratio:4/3}
    h2.section{font-size:21px}
  }
  @media(max-width:380px){ .bn-item .bn-l{font-size:10px} .logo .mark{font-size:34px} }
  .menu-item:active{transform:scale(.99)} .btn:active{transform:scale(.985)}
  @media print{ #bottomNav,#pwaInstall{display:none!important} }
</style>
</head>
<body>
<div id="app"></div>
<nav id="bottomNav" aria-label="nav"></nav>
<div id="pwaInstall" hidden></div>
<div id="printArea"></div>

function parseLooseJSON(text){
 if(!text)return null;
 let t=String(text).replace(/```json/gi,'').replace(/```/g,'').trim();
 const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<=a)return null;
 let s=t.slice(a,b+1);
 const tries=[s,s.replace(/,\s*([}\]])/g,'$1'),s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,''),s.replace(/[\r\n\t]+/g,' ').replace(/,\s*([}\]])/g,'$1')];
 for(const c of tries){try{return JSON.parse(c);}catch(_){}}
 try{let depth=0,end=-1,inStr=false,esc=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
   if(inStr){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch==='"')inStr=false;}
   else{if(ch==='"')inStr=true;else if(ch==='{'||ch==='[')depth++;else if(ch==='}'||ch===']'){depth--;if(depth===0)end=i;}}}
  if(end>0)return JSON.parse(s.slice(0,end+1).replace(/[\r\n\t]+/g,' ').replace(/,\s*([}\]])/g,'$1'));
 }catch(_){}
 return null;
}

     if(rd){const v=parseInt(rd);if(v>0)sec=Math.min(Math.max(v+2,8),30)}}}catch(_){}

  }

function compress(dataUrl){return new Promise(res=>{
 const img=new Image();
 img.onload=()=>{const w=Math.min(1280,img.width),h=Math.round(img.height*w/img.width);
  const c=document.createElement('canvas');c.width=w;c.height=h;

function shrinkLogo(dataUrl){return new Promise(res=>{
 const img=new Image();
 img.onload=()=>{const max=384;const f=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*f);c.height=Math.round(img.height*f);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  res(c.toDataURL('image/png'))};
 img.onerror=()=>res(dataUrl);
 img.src=dataUrl;})}
function extractColors(dataUrl){return new Promise(res=>{
 const img=new Image();
 img.onload=()=>{
  const c=document.createElement('canvas');const N=80;c.width=N;c.height=N;
  const ctx=c.getContext('2d');ctx.drawImage(img,0,0,N,N);
  let d;try{d=ctx.getImageData(0,0,N,N).data}catch(e){res([]);return}
  const buckets={};
  for(let i=0;i<d.length;i+=4){
   const r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];
   if(a<140)continue;
   const key=(r>>5)+','+(g>>5)+','+(b>>5);
   const bk=buckets[key]||(buckets[key]={n:0,r:0,g:0,b:0});
   bk.n++;bk.r+=r;bk.g+=g;bk.b+=b;
  }
  const sorted=Object.values(buckets).sort((a,b)=>b.n-a.n);
  const picked=[];
  const hex=v=>('0'+Math.round(v).toString(16)).slice(-2);
  for(const bk of sorted){
   const r=bk.r/bk.n,g=bk.g/bk.n,b=bk.b/bk.n;
   const isNearWhite=r>235&&g>235&&b>235;
   if(isNearWhite&&picked.length)continue;
   const far=picked.every(p=>Math.abs(p.r-r)+Math.abs(p.g-g)+Math.abs(p.b-b)>90);
   if(!far)continue;
   picked.push({r,g,b});
   if(picked.length>=4)break;
  }
  res(picked.map(p=>'#'+hex(p.r)+hex(p.g)+hex(p.b)));
 };
 img.onerror=()=>res([]);
 img.src=dataUrl;})}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load failed: '+src));document.head.appendChild(s);});}
async function pdfToImage(file){

  if(window.pdfjsLib&&window.pdfjsLib.GlobalWorkerOptions) window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 }
 if(!window.pdfjsLib) throw new Error('pdf.js unavailable');
 const buf=await file.arrayBuffer();
 const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
 const page=await pdf.getPage(1);
 let vp=page.getViewport({scale:2});
 const targetW=Math.min(1600,vp.width);const f=targetW/vp.width;
 vp=page.getViewport({scale:2*f});
 const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
 await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
 return c.toDataURL('image/png');
}

  else{ dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=()=>rej(new Error('read error'));r.readAsDataURL(f);}); }
  const small=await shrinkLogo(dataUrl);
  const colors=await extractColors(small);
  S.input.logo=small;
  if(colors.length)S.input.logoColors=colors;
  render();
 }catch(e){ alert((S.lang==='ar'?'تعذّر قراءة الملف: ':'Could not read file: ')+((e&&e.message)||e)); }
}

/* ───────── generation flows ───────── */
async function generate(){
 S.genError='';S.genMode='new';
 if(!S.claudeKey.trim()){S.genError=t('noKey');render();return}
 if((S.imgProvider==='google'||S.imgProvider==='both')&&!S.googleKey.trim()){S.genError=t('noKey');render();return}
 if((S.imgProvider==='openai'||S.imgProvider==='both')&&(!S.openaiKey.trim()||!S.proxyUrl.trim())){S.genError=S.proxyUrl.trim()?t('noOpenaiKey'):t('noProxy');render();return}
 try{
  if(S.input.logo&&!S.input.logoAnalysis&&S.claudeKey.trim()){S.genStatus=t('analyzingLogo');render();try{await analyzeLogoWithClaude(S.input)}catch(_){}}
  S.genStatus=t('analyzing');render();
  const {concepts,tips}=await analyze(S.input);
  let lastImgErr='';
  for(let i=0;i<concepts.length;i++){
   S.genStatus=t('rendering',{n:i+1});render();
   try{await renderConcept(concepts[i],concepts[i].imagePrompt,S.input.logo,
    sec=>{S.genStatus=t('waiting',{s:sec});render()})}
   catch(e){console.warn('render '+(i+1)+' failed',e);lastImgErr=e.message}
   if(i<concepts.length-1)await sleep(3000);
  }
  if(!concepts.some(c=>c.image))throw new Error(lastImgErr||'All image renders failed. Press "Test keys" in Settings.');
  S.genError='';
  if(S.editingProjectId){
   const ep=S.projects.find(x=>x.id===S.editingProjectId);
   if(ep){
    ep.versions=ep.versions||[];
    ep.versions.unshift({ts:ep.updatedAt||ep.createdAt,input:ep.input,concepts:ep.concepts,tips:ep.tips,selectedConceptId:ep.selectedConceptId});
    if(ep.versions.length>8)ep.versions=ep.versions.slice(0,8);
    ep.input=S.input;ep.concepts=concepts;ep.tips=tips;ep.selectedConceptId=null;ep.updatedAt=Date.now();
    S.currentId=ep.id;S.editingProjectId=null;persist();nav('results');return;
   }
   S.editingProjectId=null;
  }
  const np={id:'p'+Date.now(),createdAt:Date.now(),input:S.input,concepts,tips,selectedConceptId:null};
  S.projects.unshift(np);persist();
  S.currentId=np.id;nav('results');
 }catch(e){S.genError=e.message||t('failed');render()}
}
async function fillMissingImages(){
 const p=proj();if(!p)return;
 S.genMode='fill';S.genError='';S.view='generating';
 const missing=p.concepts.filter(c=>!c.image);
 let lastImgErr='';
 for(let i=0;i<missing.length;i++){
  S.genStatus=t('rendering',{n:i+1});render();
  try{await renderConcept(missing[i],missing[i].imagePrompt,p.input.logo,
   sec=>{S.genStatus=t('waiting',{s:sec});render()})}
  catch(e){lastImgErr=e.message}
  if(i<missing.length-1)await sleep(3000);
 }
 persist();
 if(p.concepts.some(c=>!c.image)&&lastImgErr){S.genError=lastImgErr;render();return}
 S.genError='';nav('results');
}
const EXTRA_ANGLES=[
 {id:'side',txt:'eye-level view from the side aisle, 90-degree side angle showing the booth depth'},
 {id:'inside',txt:'interior view standing inside the booth looking toward the open front, showing counters, screens and visitor areas'},
 {id:'top',txt:'high aerial top-down three-quarter view revealing the full floor layout'}
];
async function generateViews(conceptId){
 const p=proj();if(!p)return;
 const c=p.concepts.find(x=>x.id===conceptId);
 if(!c||!c.image)return;
 S.genMode='views';S.viewsTarget=conceptId;S.genError='';S.view='generating';
 c.views=c.views||[];
 let lastErr='';let first=true;
 for(let i=0;i<EXTRA_ANGLES.length;i++){
  const ang=EXTRA_ANGLES[i];
  if(c.views.some(v=>v.id===ang.id))continue;
  if(!first)await sleep(3000);
  first=false;
  S.genStatus=t('generatingAngle',{n:i+1});render();
  try{
   const img=await renderAngle(c.image,ang.txt,sec=>{S.genStatus=t('waiting',{s:sec});render()});
   c.views.push({id:ang.id,image:img});persist();
  }catch(e){lastErr=e.message}
 }
 if(c.views.length<EXTRA_ANGLES.length&&lastErr){S.genError=lastErr;render();return}
 S.genError='';nav('results');
}
function showView(cid,idx){const p=proj();if(!p)return;
 const c=p.concepts.find(x=>x.id===cid);if(!c)return;c._shown=idx;render()}
function retryGen(){S.genError='';S.view='generating';render();
 (S.genMode==='refine'?applyRefine((S.refineTarget||{}).cid,(S.refineTarget||{}).txt):S.genMode==='views'?generateViews(S.viewsTarget):S.genMode==='fill'?fillMissingImages():generate())}

/* ───────── 2D plan ───────── */
const P={paper:'#FFFFFF',ink:'#141414',acc:'#5A9E2F',acc2:'#C77F22',grid:'#E6EADF'};
const SW=680,SH=480,MG=64;
function schedule(inp){
 const rows=[];let n=1;
 for(const id of inp.decorations){const i=DECOR.find(x=>x.id===id);if(!i)continue;
  rows.push({n:n++,id,label:S.lang==='ar'?i.ar:i.en,cat:'decor',placed:i.w>0})}
 for(const id of inp.services){const i=SERV.find(x=>x.id===id);if(!i)continue;
  rows.push({n:n++,id,label:S.lang==='ar'?i.ar:i.en,cat:'service',placed:i.w>0})}
 if(inp.decorInside&&inp.decorInside.trim())rows.push({n:'•',id:'_inside',label:(S.lang==='ar'?'داخلي: ':'Interior: ')+inp.decorInside.trim(),cat:'custom',placed:false});
 if(inp.decorOutside&&inp.decorOutside.trim())rows.push({n:'•',id:'_outside',label:(S.lang==='ar'?'خارجي: ':'Exterior: ')+inp.decorOutside.trim(),cat:'custom',placed:false});
 return rows;
}
function dimH(x1,x2,y,lb){return `<g stroke="${P.ink}" stroke-width="1" fill="${P.ink}">
<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line x1="${x1}" y1="${y-5}" x2="${x1}" y2="${y+5}"/>
<line x1="${x2}" y1="${y-5}" x2="${x2}" y2="${y+5}"/>
<polygon points="${x1},${y} ${x1+7},${y-3} ${x1+7},${y+3}"/><polygon points="${x2},${y} ${x2-7},${y-3} ${x2-7},${y+3}"/>
<text x="${(x1+x2)/2}" y="${y-6}" font-size="12" font-family="Arial" text-anchor="middle" stroke="none">${esc(lb)}</text></g>`}
function dimV(x,y1,y2,lb){return `<g stroke="${P.ink}" stroke-width="1" fill="${P.ink}">
<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line x1="${x-5}" y1="${y1}" x2="${x+5}" y2="${y1}"/>
<line x1="${x-5}" y1="${y2}" x2="${x+5}" y2="${y2}"/>
<polygon points="${x},${y1} ${x-3},${y1+7} ${x+3},${y1+7}"/><polygon points="${x},${y2} ${x-3},${y2-7} ${x+3},${y2-7}"/>
<text x="${x-8}" y="${(y1+y2)/2}" font-size="12" font-family="Arial" text-anchor="middle" stroke="none" transform="rotate(-90 ${x-8} ${(y1+y2)/2})">${esc(lb)}</text></g>`}
function tagSvg(cx,cy,n){return `<g><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="9" fill="${P.acc}"/>
<text x="${cx.toFixed(1)}" y="${(cy+3.5).toFixed(1)}" font-size="10" font-weight="bold" font-family="Arial" text-anchor="middle" fill="#FFF">${n}</text></g>`}

function topViewSvg(inp){
 const sc=Math.min((SW-MG*2)/inp.width,(SH-MG*2)/inp.depth);
 const bw=inp.width*sc,bd=inp.depth*sc,x0=(SW-bw)/2,y0=(SH-bd)/2;
 const sh=shapeById(inp.type);
 let s=`<svg viewBox="0 0 ${SW} ${SH}" xmlns="http://www.w3.org/2000/svg"><rect width="${SW}" height="${SH}" fill="${P.paper}"/>`;
 s+=`<g stroke="${P.grid}" stroke-width="1">`;
 for(let m=1;m<inp.width;m++){const gx=x0+m*sc;s+=`<line x1="${gx}" y1="${y0}" x2="${gx}" y2="${y0+bd}"/>`}
 for(let m=1;m<inp.depth;m++){const gy=y0+m*sc;s+=`<line x1="${x0}" y1="${gy}" x2="${x0+bw}" y2="${gy}"/>`}
 s+=`</g><rect x="${x0}" y="${y0}" width="${bw}" height="${bd}" fill="none" stroke="${P.ink}" stroke-width="1"/>`;
 const closed={back:['inline','corner','peninsula'].includes(inp.type),left:['inline','corner'].includes(inp.type),right:['inline'].includes(inp.type)};
 const wall=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${P.ink}" stroke-width="6"/>`;
 const open=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${P.acc}" stroke-width="2" stroke-dasharray="8 5"/>`;
 s+=closed.back?wall(x0,y0,x0+bw,y0):open(x0,y0,x0+bw,y0);
 s+=closed.left?wall(x0,y0,x0,y0+bd):open(x0,y0,x0,y0+bd);
 s+=closed.right?wall(x0+bw,y0,x0+bw,y0+bd):open(x0+bw,y0,x0+bw,y0+bd);
 s+=open(x0,y0+bd,x0+bw,y0+bd);
 if(inp.type==='doubleDecker'){
  const sw2=Math.min(1.2*sc,bw*0.25),sd=Math.min(2.4*sc,bd*0.45),sx=x0+4,sy=y0+4;
  s+=`<rect x="${sx}" y="${sy}" width="${sw2}" height="${sd}" fill="none" stroke="${P.acc2}" stroke-width="1.5"/>`;
  for(let i=1;i<6;i++){const yy=sy+(sd/6)*i;s+=`<line x1="${sx}" y1="${yy}" x2="${sx+sw2}" y2="${yy}" stroke="${P.acc2}" stroke-width="1"/>`}
  s+=`<text x="${sx+sw2/2}" y="${sy+sd+12}" font-size="10" font-family="Arial" text-anchor="middle" fill="${P.acc2}">${t('stairs')}</text>`;
 }
 const PAD=0.15;
 const placeable=schedule(inp).filter(r=>r.placed).map(r=>{const it=itemById(r.id);
  return{n:r.n,id:r.id,w:Math.min(it.w,inp.width*0.45),d:Math.min(it.d,inp.depth*0.45)}});
 const draw=(xM,yM,wM,dM,n)=>{const rx=x0+xM*sc,ry=y0+yM*sc,rw=wM*sc,rd=dM*sc;
  s+=`<rect x="${rx.toFixed(1)}" y="${ry.toFixed(1)}" width="${rw.toFixed(1)}" height="${rd.toFixed(1)}" rx="2" fill="#F2F7EC" stroke="${P.acc}" stroke-width="1.5"/>`;
  s+=tagSvg(rx+rw/2,ry+rd/2,n)};
 const led=placeable.find(i=>i.id==='backWallLed');
 const rec=placeable.find(i=>i.id==='receptionCounter');
 const gen=placeable.filter(i=>i!==led&&i!==rec);
 const used=gen.reduce((a,i)=>a+i.w*i.d,0),budget=0.5*inp.width*inp.depth;
 if(used>budget){const f=Math.sqrt(budget/used);for(const i of gen){i.w*=f;i.d*=f}}
 gen.sort((a,b)=>b.w*b.d-a.w*a.d);
 let yC=PAD;
 if(led){const lw=Math.min(led.w,inp.width-2*PAD);draw((inp.width-lw)/2,PAD,lw,led.d,led.n);yC=led.d+2*PAD}
 const frontRes=rec?rec.d+2*PAD:PAD;
 const stW=inp.type==='doubleDecker'?Math.min(1.2,inp.width*0.25)+PAD:0;
 const stD=inp.type==='doubleDecker'?Math.min(2.4,inp.depth*0.45):0;
 let xC=PAD,rowD=0;const maxY=inp.depth-frontRes;
 for(const it of gen){
  if(yC<stD&&xC<stW+PAD)xC=stW+PAD;
  if(xC+it.w>inp.width-PAD){xC=PAD;yC+=rowD+PAD;rowD=0;if(yC<stD)xC=stW+PAD}
  if(yC+it.d>maxY){const rem=maxY-yC;if(rem>0.4)it.d=rem;else continue}
  draw(xC,yC,it.w,it.d,it.n);xC+=it.w+PAD;rowD=Math.max(rowD,it.d);
 }
 if(rec){const rw=Math.min(rec.w,inp.width-2*PAD);draw((inp.width-rw)/2,inp.depth-PAD-rec.d,rw,rec.d,rec.n)}
 s+=`<text x="${x0+bw/2}" y="${y0+bd+18}" font-size="11" font-weight="bold" font-family="Arial" text-anchor="middle" fill="${P.acc}">▼ ${t('front')} ▼</text>`;
 s+=dimH(x0,x0+bw,y0+bd+36,inp.width.toFixed(2)+' m');
 s+=dimV(x0-24,y0,y0+bd,inp.depth.toFixed(2)+' m');
 const shLabel=S.lang==='ar'?sh.ar:sh.en;
 s+=`<text x="${SW/2}" y="24" font-size="12" font-family="Arial" text-anchor="middle" fill="${P.ink}">${esc(shLabel)}${inp.type==='custom'&&inp.customShapeNote?' — '+esc(inp.customShapeNote.slice(0,60)):''}</text>`;
 return s+'</svg>';
}

 if(inp.decorations.includes('backWallLed')){

function bomSummary(parts){
 const mats={};
 for(const p of parts){
  const m=mats[p.mat]||(mats[p.mat]={area:0,len:0});
  if(p.linear)m.len+=p.w*p.qty;else m.area+=(p.w*p.h*p.qty)/1e6;
 }
 const out=[];
 for(const[mat,v]of Object.entries(mats)){
  const info=MATERIALS[mat];
  if(info.sheet)out.push({mat,label:t(info.key),qty:Math.ceil(v.area*1.15/2.9768),unit:t('sheetsOf')});
  else{const meters=Math.ceil(v.len*1.15/1000);
   out.push({mat,label:t(info.key),qty:meters,unit:t('linMeters'),bars:Math.ceil(meters/6)})}
 }
 return out;
}
function nestParts(parts){
 const SW2=2440,SH2=1220,GAP=6,M=4;
 const byMat={};
 for(const p of parts){
  if(!MATERIALS[p.mat].sheet)continue;
  for(let q=0;q<p.qty;q++){
   let w=p.w,h=p.h;
   if(h>SH2&&w<=SH2){const tmp=w;w=h;h=tmp}
   if(h>SH2)h=SH2;
   if(w>SW2)w=SW2;
   (byMat[p.mat]=byMat[p.mat]||[]).push({w,h,label:'#'+p.n+'  '+w+'×'+h});
  }
 }
 const out={};
 for(const[mat,rects]of Object.entries(byMat)){
  const full=rects.filter(r=>r.w>=SW2-12&&r.h>=SH2-12);
  const rest=rects.filter(r=>!(r.w>=SW2-12&&r.h>=SH2-12));
  const sheets=full.map(r=>({rects:[{x:0,y:0,w:SW2,h:SH2,label:r.label}]}));
  rest.sort((a,b)=>b.h-a.h||b.w-a.w);
  let sh=null,x=M,y=M,rowH=0;
  const newSheet=()=>{sh={rects:[]};sheets.push(sh);x=M;y=M;rowH=0};
  if(rest.length)newSheet();
  for(const r of rest){
   const mx=(r.w>=SW2-2*M)?0:M;  /* full-width parts sit flush */
   const my=(r.h>=SH2-2*M)?0:M;  /* full-height parts sit flush */
   if(x+r.w>SW2-mx){if(rowH>0)y+=rowH+GAP;x=mx;rowH=0}
   if(x<mx)x=mx;
   if(y+r.h>SH2-my){if(sh.rects.length)newSheet();x=mx;y=my;rowH=0}
   if(y<my)y=my;
   sh.rects.push({x,y,w:r.w,h:r.h,label:r.label});
   x+=r.w+GAP;rowH=Math.max(rowH,r.h);
  }
  out[mat]=sheets;
 }
 return out;
}
function sheetSvg(sheet){
 const W=2440,H=1220;
 let s='<svg viewBox="-25 -25 '+(W+50)+' '+(H+50)+'" xmlns="http://www.w3.org/2000/svg">';
 s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#FFFFFF" stroke="#141414" stroke-width="5"/>';
 for(const r of sheet.rects){
  s+='<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" fill="#F2F7EC" stroke="#5A9E2F" stroke-width="3"/>';
  const fs=Math.max(30,Math.min(64,Math.min(r.h,r.w)/4));
  s+='<text x="'+(r.x+r.w/2)+'" y="'+(r.y+r.h/2+fs/3)+'" font-size="'+fs+'" font-family="Arial" text-anchor="middle" fill="#141414">'+esc(r.label)+'</text>';
 }
 return s+'</svg>';
}

/* ───────── DXF export ───────── */
function buildDxf(inp){
 const parts=buildParts(inp);
 const nested=nestParts(parts);
 const L=[];
 const push=(...a)=>{for(const x of a)L.push(String(x))};
 push(0,'SECTION',2,'HEADER',9,'$ACADVER',1,'AC1009',9,'$INSUNITS',70,4,0,'ENDSEC');
 push(0,'SECTION',2,'TABLES',0,'TABLE',2,'LAYER',70,6);
 for(const[name,color]of [['SHEET',8],['MDF',1],['PLY',3],['STEEL',5],['ALU',4],['LABELS',2]])
  push(0,'LAYER',2,name,70,0,62,color,6,'CONTINUOUS');
 push(0,'ENDTAB',0,'ENDSEC');
 push(0,'SECTION',2,'ENTITIES');
 const rect=(layer,x,y,w,h)=>{
  const pts=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
  for(let i=0;i<4;i++){const a=pts[i],b=pts[(i+1)%4];
   push(0,'LINE',8,layer,10,a[0].toFixed(1),20,a[1].toFixed(1),30,0,11,b[0].toFixed(1),21,b[1].toFixed(1),31,0)}
 };
 const text=(layer,x,y,hgt,str)=>{push(0,'TEXT',8,layer,10,x.toFixed(1),20,y.toFixed(1),30,0,40,hgt,1,str)};
 let oy=0;
 for(const[mat,sheets]of Object.entries(nested)){
  let ox=0;
  text('LABELS',0,oy+1260,90,MATERIALS[mat].layer+' — 2440x1220 sheets');
  for(const sh of sheets){
   rect('SHEET',ox,oy,2440,1220);
   for(const r of sh.rects){
    rect(MATERIALS[mat].layer,ox+r.x,oy+(1220-r.y-r.h),r.w,r.h);
    text('LABELS',ox+r.x+25,oy+(1220-r.y-r.h)+r.h/2,Math.min(60,Math.max(30,r.h/4)),r.label.replace(/\s+/g,' '));
   }
   ox+=2440+300;
  }
  oy-=1220+700;
 }
 let lyy=oy-400;
 text('LABELS',0,lyy+260,90,'LINEAR CUTTING LIST (structure)');
 for(const p of parts.filter(p=>p.linear)){
  rect(MATERIALS[p.mat].layer,0,lyy,p.w,50);
  text('LABELS',p.w+120,lyy+10,60,'#'+p.n+'  L='+p.w+'mm  x'+p.qty+'  ['+MATERIALS[p.mat].layer+']');
  lyy-=220;
 }
 push(0,'ENDSEC',0,'EOF');
 return L.join('\r\n');
}
function downloadDxf(){
 const p=proj();if(!p)return;
 const blob=new Blob([buildDxf(p.input)],{type:'application/dxf'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='BOOTH-STUDIO-fab-'+((p.input.companyName.trim()||p.id).replace(/[^\w؀-ۿ-]+/g,'_'))+'.dxf';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

function _downloadJson(obj,filename){
 const blob=new Blob([JSON.stringify(obj)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function _projFilename(p){const base=(p&&p.input&&p.input.companyName.trim())||(p&&p.id)||'project';return 'BOOTH-STUDIO-'+base.replace(/[^\w؀-ۿ-]+/g,'_')+'.hive.json';}
function exportProject(id){
 const p=S.projects.find(x=>x.id===id);if(!p)return;
 _downloadJson({app:'BOOTH STUDIO',type:'hive-project',version:1,exportedAt:Date.now(),project:p},_projFilename(p));
 S.savedMsg=true;render();setTimeout(()=>{S.savedMsg=false;if(S.view==='projects'||S.view==='plan')render()},1800);
}
function exportAllProjects(){
 if(!S.projects.length){alert(t('empty'));return}
 _downloadJson({app:'BOOTH STUDIO',type:'hive-projects',version:1,exportedAt:Date.now(),projects:S.projects},'BOOTH-STUDIO-all-projects-'+new Date().toISOString().slice(0,10)+'.hive.json');
}
function triggerImportProject(){
 let fin=document.getElementById('hiveImportFile');if(fin)fin.remove();
 fin=document.createElement('input');fin.type='file';fin.id='hiveImportFile';fin.accept='.json,application/json';fin.style.display='none';
 fin.onchange=async ev=>{
  const f=ev.target.files&&ev.target.files[0];if(!f){fin.remove();return}
  try{
   const txt=await f.text();const obj=JSON.parse(txt);
   let added=0;const addOne=pr=>{if(!pr||!pr.input||!Array.isArray(pr.concepts))return;
    pr.id='p'+Date.now()+'_'+(added++);if(!pr.createdAt)pr.createdAt=Date.now();S.projects.unshift(pr);};
   if(obj&&obj.type==='hive-project'&&obj.project)addOne(obj.project);
   else if(obj&&obj.type==='hive-projects'&&Array.isArray(obj.projects))obj.projects.forEach(addOne);
   else if(Array.isArray(obj))obj.forEach(addOne);
   else if(obj&&obj.input&&Array.isArray(obj.concepts))addOne(obj);
   if(!added)throw new Error('empty');
   persist();alert(t('importOk'));nav('projects');
  }catch(e){alert(t('importErr'));}
  fin.remove();
 };
 document.body.appendChild(fin);fin.click();
}

 if(has('logoTower'))el.push({kind:'tower',ar:'برج لوقو',en:'Logo tower',x:120,y:D-720,w:600,d:600,h:Math.min(H+600,3600)});
 if(has('meetingRoom'))el.push({kind:'room',ar:'غرفة اجتماعات',en:'Meeting',x:Math.max(120,W-3000-120),y:120,w:Math.min(3000,Math.round(W*0.45)),d:Math.min(2500,Math.round(D*0.5)),h:2600,door:true});
 if(has('storageRoom'))el.push({kind:'room',ar:'مستودع',en:'Storage',x:120,y:120,w:1500,d:1500,h:2400,door:true});
 if(has('productShelves'))el.push({kind:'shelfUnit',ar:'أرفف',en:'Shelves',x:120,y:Math.round(D/2),w:2000,d:500,h:2000,shelves:4});
 if(has('displayPodium'))for(let i=0;i<3;i++)el.push({kind:'podium',ar:'بوديوم',en:'Podium',x:700+i*900,y:Math.round(D*0.45),w:600,d:600,h:1000});
 if(has('archEntrance'))el.push({kind:'arch',ar:'قوس',en:'Arch',x:Math.round(W/2-1500),y:D-300,w:3000,d:300,h:Math.min(H,3000)});
 if(has('presentationStage'))el.push({kind:'stage',ar:'منصة',en:'Stage',x:Math.round(W/2-1500),y:Math.round(D/2-1000),w:3000,d:2000,h:300});
 if(has('raisedFloor'))el.push({kind:'floor',ar:'أرضية مرتفعة',en:'Raised floor',x:0,y:0,w:W,d:D,raised:true,mat:'ply18'});
 else if(has('woodFloor'))el.push({kind:'floor',ar:'أرضية خشب',en:'Wood floor',x:0,y:0,w:W,d:D,mat:'ply18'});
 return {booth:{W,D,H,type:inp.type},closed,structMat,elements:el};}
function planSvgSpec(spec){const W=spec.booth.W,D=spec.booth.D;const pad=70,vw=900,inW=vw-2*pad;const sc=inW/W;const bw=W*sc,bh=D*sc;const x0=pad,y0=pad,vh=Math.round(bh)+2*pad+60;
 let s=`<svg viewBox="0 0 ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg"><rect width="${vw}" height="${vh}" fill="#fff"/><g stroke="#e6eadf" stroke-width="1">`;
 for(let m=1;m*1000<W;m++){const gx=x0+m*1000*sc;s+=`<line x1="${gx.toFixed(1)}" y1="${y0}" x2="${gx.toFixed(1)}" y2="${(y0+bh).toFixed(1)}"/>`;}
 for(let m=1;m*1000<D;m++){const gy=y0+m*1000*sc;s+=`<line x1="${x0}" y1="${gy.toFixed(1)}" x2="${(x0+bw).toFixed(1)}" y2="${gy.toFixed(1)}"/>`;}
 s+=`</g><rect x="${x0}" y="${y0}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="none" stroke="#141414" stroke-width="1.2"/>`;
 const wl=(a,b,c,d)=>`<line x1="${a.toFixed(1)}" y1="${b.toFixed(1)}" x2="${c.toFixed(1)}" y2="${d.toFixed(1)}" stroke="#141414" stroke-width="6"/>`;
 if(spec.closed.back)s+=wl(x0,y0,x0+bw,y0);if(spec.closed.left)s+=wl(x0,y0,x0,y0+bh);if(spec.closed.right)s+=wl(x0+bw,y0,x0+bw,y0+bh);
 let n=1;for(const e of spec.elements){if(e.kind==='wall'||e.kind==='floor'){continue;}
  const ex=x0+(e.x||0)*sc,ey=y0+(e.y||0)*sc,ew=(e.w||300)*sc,ed=(e.d||300)*sc;
  s+=`<rect x="${ex.toFixed(1)}" y="${ey.toFixed(1)}" width="${ew.toFixed(1)}" height="${ed.toFixed(1)}" rx="2" fill="#F2F7EC" stroke="#5A9E2F" stroke-width="1.4"/>`;
  s+=`<circle cx="${(ex+ew/2).toFixed(1)}" cy="${(ey+ed/2).toFixed(1)}" r="9" fill="#5A9E2F"/><text x="${(ex+ew/2).toFixed(1)}" y="${(ey+ed/2+3.5).toFixed(1)}" font-size="11" font-family="Arial" text-anchor="middle" fill="#fff">${n}</text>`;
  e._tag=n;n++;}
 s+=`<text x="${(x0+bw/2).toFixed(1)}" y="${(y0+bh+22).toFixed(1)}" font-size="12" text-anchor="middle" font-family="Arial" fill="#141414">${(W/1000).toFixed(2)} m</text>`;
 s+=`<text x="${(x0-16).toFixed(1)}" y="${(y0+bh/2).toFixed(1)}" font-size="12" text-anchor="middle" font-family="Arial" fill="#141414" transform="rotate(-90 ${(x0-16).toFixed(1)} ${(y0+bh/2).toFixed(1)})">${(D/1000).toFixed(2)} m</text>`;
 const sb=1000*sc;s+=`<rect x="${x0}" y="${(y0+bh+36).toFixed(1)}" width="${sb.toFixed(1)}" height="6" fill="#141414"/><rect x="${(x0+sb/2).toFixed(1)}" y="${(y0+bh+36).toFixed(1)}" width="${(sb/2).toFixed(1)}" height="6" fill="#fff" stroke="#141414"/><text x="${(x0+sb+8).toFixed(1)}" y="${(y0+bh+47).toFixed(1)}" font-size="11" font-family="Arial" fill="#141414">1 m</text>`;
 s+=`<text x="${(x0+bw).toFixed(1)}" y="${(y0+bh+47).toFixed(1)}" font-size="10" text-anchor="end" font-family="Arial" fill="#888">▼ الواجهة / FRONT ▼</text>`;
 return s+'</svg>';}
function frontElevSpecSvg(spec){const W=spec.booth.W,H=spec.booth.H;const pad=70,vw=900,inW=vw-2*pad;const sc=inW/W;const bw=W*sc,bh=H*sc;const x0=pad,y0=pad,gy=y0+bh,vh=Math.round(bh)+2*pad+40;
 let s=`<svg viewBox="0 0 ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg"><rect width="${vw}" height="${vh}" fill="#fff"/>`;
 s+=`<rect x="${x0}" y="${y0}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="#FAFCF7" stroke="#141414" stroke-width="2"/>`;
 s+=`<line x1="${(x0-20).toFixed(1)}" y1="${gy.toFixed(1)}" x2="${(x0+bw+20).toFixed(1)}" y2="${gy.toFixed(1)}" stroke="#141414" stroke-width="2"/>`;
 const band=Math.min(40,bh*0.16);s+=`<rect x="${x0}" y="${y0}" width="${bw.toFixed(1)}" height="${band.toFixed(1)}" fill="#5A9E2F"/>`;
 const put=(ex,zTop,zBot,ew,fill,tag)=>{const rx=x0+ex*sc,ry=gy-zTop*sc,rh=(zTop-zBot)*sc,rw=ew*sc;s+=`<rect x="${rx.toFixed(1)}" y="${ry.toFixed(1)}" width="${rw.toFixed(1)}" height="${rh.toFixed(1)}" fill="${fill}" stroke="#141414" stroke-width="1.2"/>`;if(tag)s+=`<circle cx="${(rx+rw/2).toFixed(1)}" cy="${(ry+rh/2).toFixed(1)}" r="8" fill="#5A9E2F"/><text x="${(rx+rw/2).toFixed(1)}" y="${(ry+rh/2+3).toFixed(1)}" font-size="10" font-family="Arial" text-anchor="middle" fill="#fff">${tag}</text>`;};
 for(const e of spec.elements){const tg=e._tag;
  if(e.kind==='led'){put(e.x,(H-300),(H-300-e.h),e.w,'#1a1a1a',tg);}
  else if(['counter','podium','shelfUnit','tower','room','stage','arch'].includes(e.kind)){put(e.x,e.h,0,e.w,'#EDF3E4',tg);}}
 s+=`<text x="${(x0+bw/2).toFixed(1)}" y="${(gy+24).toFixed(1)}" font-size="12" text-anchor="middle" font-family="Arial" fill="#141414">${(W/1000).toFixed(2)} m</text>`;
 s+=`<text x="${(x0+bw+24).toFixed(1)}" y="${(y0+bh/2).toFixed(1)}" font-size="12" text-anchor="middle" font-family="Arial" fill="#141414" transform="rotate(-90 ${(x0+bw+24).toFixed(1)} ${(y0+bh/2).toFixed(1)})">${(H/1000).toFixed(2)} m</text>`;
 return s+'</svg>';}
function nestSheetSvgF(sheet){const W=2440,H=1220;let s='<svg viewBox="-20 -20 '+(W+40)+' '+(H+40)+'" xmlns="http://www.w3.org/2000/svg">';
 s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fff" stroke="#141414" stroke-width="5"/>';
 for(const r of sheet.rects){s+='<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" fill="#F2F7EC" stroke="#5A9E2F" stroke-width="3"/>';
  if(r.grain){const cx=r.x+r.w/2,cy=r.y+r.h/2,Lg=Math.min(r.w,r.h)*0.3;s+='<line x1="'+(cx-Lg).toFixed(0)+'" y1="'+cy.toFixed(0)+'" x2="'+(cx+Lg).toFixed(0)+'" y2="'+cy.toFixed(0)+'" stroke="#C77F22" stroke-width="2" marker-end="url(#ar)"/>';}
  const fs=Math.max(26,Math.min(60,Math.min(r.h,r.w)/4));s+='<text x="'+(r.x+r.w/2)+'" y="'+(r.y+r.h/2-fs*0.7)+'" font-size="'+fs+'" font-family="Arial" text-anchor="middle" fill="#141414">'+r.label+'</text>';}
 return '<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#C77F22"/></marker></defs>'+s+'</svg>';}
/* ---- design-linked spec derivation (Claude Vision) + shop-drawings pack + CNC DXF ---- */
function sanitizeSpecEls(els,base){
 if(!Array.isArray(els))return [];
 const kinds=['wall','counter','led','tower','shelfUnit','podium','room','floor','stage','arch','generic'];
 const W=base.booth.W,D=base.booth.D,H=base.booth.H;const num=(v,def)=>{v=Math.round(+v);return isFinite(v)&&v>0?v:def;};
 let out=els.filter(e=>e&&kinds.includes(e.kind)).slice(0,40).map(e=>{
  const o={kind:e.kind,ar:String(e.ar||'').slice(0,40),en:String(e.en||'').slice(0,40)};
  o.x=Math.max(0,Math.min(num(e.x,0),W));o.y=Math.max(0,Math.min(num(e.y,0),D));
  o.w=Math.min(num(e.w,600),W);o.d=Math.min(num(e.d,600),D);o.h=Math.min(num(e.h,1000),H+800);
  if(e.len)o.len=Math.min(num(e.len,o.w),Math.max(W,D));
  if(e.shelves)o.shelves=Math.max(1,Math.min(num(e.shelves,4),10));
  if(e.door)o.door=true;if(e.raised)o.raised=true;if(e.mat)o.mat=(e.mat==='ply18'?'ply18':'mdf18');
  return o;});
 if(!out.some(e=>e.kind==='wall'))out=base.elements.filter(e=>e.kind==='wall').concat(out);
 return out;
}
async function deriveSpec(p){
 const inp=p.input;const base=specFromInputs(inp);
 const c=p.concepts.find(x=>x.id===p.selectedConceptId)||p.concepts.find(x=>x.image);
 if(p.spec&&p.specFor===((c&&c.id)||null))return p.spec;
 let spec=base;
 if(c&&c.image&&S.claudeKey.trim()){
  try{
   const sys='You are a senior exhibition-booth TECHNICAL designer. You SEE the approved booth design image. Output ONLY strict JSON (no prose). Schema: {"elements":[{"kind":"wall|counter|led|tower|shelfUnit|podium|room|floor|stage|arch|generic","ar":"اسم عربي","en":"name","x":int,"y":int,"w":int,"d":int,"h":int,"len":int,"shelves":int,"door":true,"raised":true}]} . Origin = back-left floor corner; x=width (0..'+base.booth.W+'), y=depth toward the aisle (0..'+base.booth.D+'); ALL millimetres; respect booth '+base.booth.W+'×'+base.booth.D+'×'+base.booth.H+' mm. Include the closed perimeter walls. Place each element where it appears in the image with realistic sizes. Output JSON only.';
   const usr='Booth '+inp.width+'×'+inp.depth+'×'+inp.height+' m, type '+inp.type+'. Closed sides '+JSON.stringify(base.closed)+'. Read the attached approved design and return the build spec JSON.\n\n'+buildBrief(inp);
   const j=parseLooseJSON(await callClaudeVision(sys,usr,c.image,1600));
   const els=sanitizeSpecEls(j&&j.elements,base);
   if(els.length)spec={booth:base.booth,closed:base.closed,structMat:base.structMat,elements:els,source:'claude'};
  }catch(e){console.warn('spec derive failed',e);}
 }
 spec.source=spec.source||'auto';p.spec=spec;p.specFor=((c&&c.id)||null);persist();return spec;
}
function _matKey(m){return FMAT[m]?(S.lang==='ar'?FMAT[m].ar:FMAT[m].en):((typeof MATERIALS!=='undefined'&&MATERIALS[m])?t(MATERIALS[m].key):m);}
function buildJoinery(spec,sheetParts,linParts,barn){
 const dbl=(typeof S!=='undefined'&&S&&S.doubleSkin)?2:1;
 let battMeters=0;for(const m in barn)battMeters+=barn[m].meters||0;
 const grooved=sheetParts.filter(p=>p.groove);let jointM=0;for(const p of grooved)jointM+=((p.g+p.c)*2/1000)*p.qty;
 const panels=sheetParts.reduce((a,p)=>a+p.qty,0);
 const hw=[];const add=(ar,en,q)=>{q=Math.ceil(q);if(q>0)hw.push({ar,en,qty:q});};
 add('غراء نجارة (أنبوب 300مل)','Wood glue (300ml tube)',jointM/8*dbl);
 add('دبابيس تثبيت (علبة 5000)','Staples/pins (box of 5000)',jointM*14/5000);
 add('براغي خشب 4×40مم','Wood screws 4×40mm',jointM*4+panels*2);
 return {hw,jointM:Math.round(jointM*10)/10,battMeters:Math.round(battMeters*10)/10,dbl};
}
function setSheetSize(v){if(typeof _grabKeys==='function')_grabKeys();S.sheetSize=v;persist();render();}
function setDoubleSkin(b){if(typeof _grabKeys==='function')_grabKeys();S.doubleSkin=!!b;persist();render();}
function printShopPack(p){
 const spec=p.spec||specFromInputs(p.input);const inp=p.input;
 const {sheetParts,linParts,note}=partsFromSpec(spec);
 const nest=nestSheets(sheetParts),barn=barNest(linParts),bom=bomFromNest(nest,barn);
 const jn=buildJoinery(spec,sheetParts,linParts,barn);
 const cost=costFromSpec(spec);
 const planSvg=planSvgSpec(spec);const elevSvg=frontElevSpecSvg(spec);
 const typeC=S.lang==='ar'?'النوع':'Type',grainC=S.lang==='ar'?'التعريق':'Grain';
 const elRows=spec.elements.filter(e=>e._tag).map(e=>`<tr><td class="n">${e._tag}</td><td>${esc(S.lang==='ar'?(e.ar||e.kind):(e.en||e.kind))}</td><td>${esc(e.kind)}</td><td>${Math.round(e.w||e.len||0)}×${Math.round(e.d||0)}×${Math.round(e.h||0)}</td></tr>`).join('');
 const panelRows=sheetParts.map(pp=>`<tr><td class="n">${pp.n}</td><td>${esc(S.lang==='ar'?pp.ar:pp.en)}</td><td>${_matKey(pp.mat)}</td><td>${pp.g} × ${pp.c}</td><td class="n">${pp.grain?'▲':'—'}</td><td class="n">${pp.qty}</td></tr>`).join('');
 const linRows=linParts.map(pp=>`<tr><td class="n">${pp.n}</td><td>${esc(S.lang==='ar'?pp.ar:pp.en)}</td><td>${_matKey(pp.mat)}</td><td>L = ${pp.len}</td><td class="n">${pp.qty}</td></tr>`).join('');
 const bomRows=bom.map(b=>`<tr><td>${_matKey(b.mat)}</td><td class="n">${b.sheet?b.qty:(b.meters+' م.ط')}</td><td>${b.sheet?t('sheetsOf'):('≈ '+b.qty+' '+(S.lang==='ar'?('عود '+((b.barLen||3000)/1000)+'م'):('pcs '+((b.barLen||3000)/1000)+'m')))}</td></tr>`).join('');
 let cuts='';for(const m in nest){cuts+=`<h2>${t('secCuts')} — ${_matKey(m)} (${nest[m].sheets.length})</h2>`;nest[m].sheets.forEach(sh=>{cuts+=`<div class="sheet">${nestSheetSvgF(sh)}</div>`;});}
 const notes=[t('grainNote')];if(note.includes('arch'))notes.push(t('archNote'));if(inp.type==='doubleDecker')notes.push(t('structNote'));notes.push(t('wasteNote'));
 const srcTxt=spec.source==='claude'?(S.lang==='ar'?'Claude — من التصميم المختار':'Claude — from the selected design'):(S.lang==='ar'?'تلقائي من المدخلات':'auto from inputs');
 document.getElementById('printArea').innerHTML=titleBlock(p)+`
  <div class="note">${t('specSource')}: ${esc(srcTxt)}</div>
  <h2>${t('topView')} — ${S.lang==='ar'?'مع مسطرة المقياس':'with scale bar'}</h2><div class="dw">${planSvg}</div>
  <div class="pb"></div>
  <h2>${t('frontView')}</h2><div class="dw">${elevSvg}</div>
  <h2>${t('secElems')}</h2><table><thead><tr><th>#</th><th>${t('item')}</th><th>${typeC}</th><th>${t('dimsMm')}</th></tr></thead><tbody>${elRows||'<tr><td colspan="4">—</td></tr>'}</tbody></table>
  <div class="pb"></div>
  <h2>${t('secPanels')}</h2><table><thead><tr><th>#</th><th>${t('part')}</th><th>${t('material')}</th><th>${t('dimsMm')}</th><th>${grainC}</th><th>${t('qty')}</th></tr></thead><tbody>${panelRows||'<tr><td colspan="6">—</td></tr>'}</tbody></table>
  <h2>${t('secLinear')}</h2><table><thead><tr><th>#</th><th>${t('part')}</th><th>${t('material')}</th><th>${t('dimsMm')}</th><th>${t('qty')}</th></tr></thead><tbody>${linRows||'<tr><td colspan="5">—</td></tr>'}</tbody></table>
  <h2>${t('secBom')}</h2><table><thead><tr><th>${t('material')}</th><th>${t('qty')}</th><th></th></tr></thead><tbody>${bomRows}</tbody></table>
  <div class="pb"></div>
  ${cuts}
  <h2>${t('secJoinery')}</h2>
  <div class="note">${t('joineryNote')} — ${S.lang==='ar'?('أطوال الوصلات ≈ '+jn.jointM+' م · مرابيع ≈ '+jn.battMeters+' م.ط'):('joint length ≈ '+jn.jointM+' m · battens ≈ '+jn.battMeters+' lin.m')}</div>
  <table><thead><tr><th>${t('spName')}</th><th>${t('qty')}</th></tr></thead><tbody>${jn.hw.map(h=>`<tr><td>${esc(S.lang==='ar'?h.ar:h.en)}</td><td class="n">${h.qty}</td></tr>`).join('')}</tbody></table>
  <h2>${t('costTitle')}</h2><div class="note">${t('costNote')}</div>
  <table><thead><tr><th>${t('costItem')}</th><th>${t('costQty')}</th><th>${t('costSub')} (${t('sar')})</th></tr></thead><tbody>${cost.rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${esc(r.qty)}</td><td class="n">${r.sub.toLocaleString()}</td></tr>`).join('')}<tr><td colspan="2"><b>${t('costTotal')}</b></td><td class="n"><b>${cost.total.toLocaleString()} ${t('sar')}</b></td></tr></tbody></table>
  <div class="note">${notes.map(esc).join(' — ')}</div>
  <div class="pfoot">BOOTH STUDIO — SHOP DRAWINGS — ${new Date().getFullYear()}</div>`;
 window.print();
}
async function openShopDrawings(){
 const p=proj();if(!p)return;
 if(!p.concepts.some(c=>c.image)){alert(S.lang==='ar'?'ولّد التصاميم أولاً':'Generate designs first');return;}
 const ov=document.createElement('div');ov.className='modal-ov';ov.innerHTML='<div class="modal-card" style="text-align:center"><div class="spinner" style="margin:0 auto"></div><div class="gen-status" style="margin-top:12px">'+t('derivingSpec')+'</div></div>';document.body.appendChild(ov);
 try{await deriveSpec(p);}catch(e){console.warn(e);}finally{ov.remove();}
 printShopPack(p);
}
function _dlDxf(p){const spec=p.spec||specFromInputs(p.input);const r=partsFromSpec(spec);const nest=nestSheets(r.sheetParts);
 const blob=new Blob([dxfFromNest(nest)],{type:'application/dxf'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='BOOTH-STUDIO-CNC-'+((p.input.companyName.trim()||p.id).replace(/[^\w؀-ۿ-]+/g,'_'))+'.dxf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
async function downloadShopDxf(){const p=proj();if(!p)return;
 if(!p.spec){const ov=document.createElement('div');ov.className='modal-ov';ov.innerHTML='<div class="modal-card" style="text-align:center"><div class="spinner" style="margin:0 auto"></div><div class="gen-status" style="margin-top:12px">'+t('derivingSpec')+'</div></div>';document.body.appendChild(ov);try{await deriveSpec(p);}catch(e){}ov.remove();}
 _dlDxf(p);}
Object.assign(window,{openShopDrawings,downloadShopDxf,deriveSpec,setSheetSize,setDoubleSkin});
